# Paperbox ERP v2 - Nginx 反向代理配置
# 部署位置：/etc/nginx/sites-available/paperbox-erp.conf
# 启用：sudo ln -s /etc/nginx/sites-available/paperbox-erp.conf /etc/nginx/sites-enabled/
# 验证：sudo nginx -t && sudo systemctl reload nginx

# ============================================
# 方式 1: 单端口统一入口（推荐生产）
# ============================================
server {
    listen 80;
    server_name erp.fengshengda.com 193.112.246.85;  # 测试服 IP 或域名

    # 安全 headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # 客户端上传大小（图片上传）
    client_max_body_size 20M;

    # API 反代到 NestJS
    location /api/ {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Swagger 文档
    location /api/docs {
        proxy_pass http://127.0.0.1:3003;
        proxy_set_header Host $host;
    }

    # 静态前端（vite build 后的 dist/）
    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SPA fallback：所有非 /api 路由都返回 index.html
        # vite preview 内部已处理
    }
}

